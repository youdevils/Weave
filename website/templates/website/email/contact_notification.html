<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OnyxJar contact form</title>
</head>
<body style="font-family: sans-serif; color: #1F2430;">
    <p>New message from the OnyxJar website contact form.</p>

    <p><strong>Name:</strong> {{ name }}</p>
    <p><strong>Email:</strong> {{ email }}</p>

    <p><strong>Message:</strong></p>
    <p>{{ message|linebreaks }}</p>
</body>
</html>
