{% load assisted_status %}

<div class="onyxjar-activity-card">

    <div class="d-flex align-items-center justify-content-between mb-1">

        <span class="fw-semibold small">
            {{ task.get_operation_display }}
        </span>

        {% assisted_status_badge task %}

    </div>

    <div class="d-flex align-items-center justify-content-between">

        <span class="small text-muted">
            {{ task.completed_at|default:task.failed_at|default:task.created_at|timesince }} ago
        </span>

        {% if task.proposal_id %}
            <span class="small text-muted">
                {{ task.change_count }} change{{ task.change_count|pluralize }}
            </span>
        {% endif %}

    </div>

    <a
        href="{% url 'assisted:task_detail' task.model_id task.id %}"
        class="stretched-link"
        aria-label="View {{ task.get_operation_display }} result"
    ></a>

</div>
