{% extends "model/model_base.html" %}

{% load static %}

{% block extra_css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'assisted/css/assisted.css' %}">
{% endblock %}

{% block model_content %}

<div class="assisted-entry">

    <div class="model-page-header">

        <div>

            <div class="model-page-eyebrow">Assisted work</div>

            <h1 class="model-page-title">{{ page_title }}</h1>

            <p class="model-page-description">
                {{ page_description }}
            </p>

        </div>

    </div>

    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" class="assisted-entry-form">

        {% csrf_token %}

        <div class="mb-3">

            <label for="assistedStubIntent" class="form-label">
                {{ intent_label }}
            </label>

            <textarea
                id="assistedStubIntent"
                name="intent"
                class="form-control"
                rows="8"
                required
                placeholder="{{ intent_placeholder }}"
            >{{ request.POST.intent }}</textarea>

        </div>

        <div class="assisted-entry-actions">

            <a href="{% url 'assisted:landing' model.id %}" class="btn btn-outline-secondary">
                Cancel
            </a>

            <button type="submit" class="btn btn-primary">
                {{ submit_label }}
            </button>

        </div>

    </form>

</div>

{% endblock %}
